<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"PJS";src:url("__FUENTES__/PlusJakartaSans-ExtraBold.ttf");font-weight:800}
@font-face{font-family:"PJS";src:url("__FUENTES__/PlusJakartaSans-Bold.ttf");font-weight:700}
@font-face{font-family:"PJS";src:url("__FUENTES__/PlusJakartaSans-SemiBold.ttf");font-weight:600}
@font-face{font-family:"PJS";src:url("__FUENTES__/PlusJakartaSans-Medium.ttf");font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:"PJS",sans-serif;color:#0B0B0B}
.sc{background-image:radial-gradient(circle at 92% 6%,rgba(255,255,255,.55),transparent 32%)}
.ico{display:grid!important;place-items:center;width:120px;height:120px;border-radius:38px;background:rgba(255,255,255,.7);margin-bottom:44px}.ico svg{width:62px;height:62px;stroke-width:2}
.sc{position:absolute;inset:0;display:none}
.big{font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-.04em}
.ln{display:block;will-change:transform,opacity}
.pad{position:absolute;left:90px;right:120px;top:300px}
.eye{font-weight:800;font-size:34px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:34px;display:block}
.cap{position:absolute;left:90px;right:120px;top:180px;font-weight:800;font-size:66px;line-height:1.08;letter-spacing:-.03em}
.phone{position:absolute;left:170px;top:470px;width:740px;height:1300px;border-radius:84px;background:#fff;box-shadow:0 60px 110px -40px rgba(30,20,60,.5),0 0 0 14px #0B0B0B;overflow:hidden}
.phone img{position:absolute;left:0;top:0;width:740px;height:1300px}
.tap{position:absolute;border-radius:50%;background:rgba(15,15,14,.25);box-shadow:0 0 0 6px rgba(255,255,255,.85);display:none}
.foto{position:absolute;left:90px;width:900px;height:600px;object-fit:cover;border-radius:56px;box-shadow:0 40px 80px -40px rgba(30,20,60,.5);opacity:0}
.pill{display:inline-block;background:#E4DDFF;color:#0B0B0B;border-radius:999px;padding:26px 44px;font-weight:800;font-size:46px}
</style></head><body>
<section class="sc" id="sH"><div class="pad" id="hpad"></div><img class="foto" id="hfoto"></section>
<section class="sc" id="sP"><div class="pad" style="top:520px" id="ppad"></div></section>
<section class="sc" id="sA"><div class="cap" id="acap"></div><div class="phone" id="aph"><img id="i0"><img id="i1"></div><div class="tap" id="atap"></div><div id="nota" style="position:absolute;left:0;right:0;bottom:70px;text-align:center;font-weight:600;font-size:30px;opacity:.55">Datos de ejemplo</div></section>
<section class="sc" id="sF" style="background:#0B0B0B;color:#FAFAF8"><div class="pad" style="top:430px"><span class="big" style="font-size:112px"><span class="ln" id="d1">Así de fácil.</span><span class="ln" id="d2">Así de ahorro.</span><span class="ln" id="d3" style="color:#B9A8FF">Así de más vida.</span></span><span class="ln" id="d4" style="margin-top:100px;display:block">LOGO</span><span class="ln" id="d6" style="margin-top:22px;font-weight:700;font-size:44px;opacity:.75">Lo que ahorras, lo vives.</span><span class="ln" id="d5" style="margin-top:44px"><span class="pill">Apúntate · enlace en el perfil</span></span></div></section>
<script src="__ICONOS__"></script>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const io=(el,t,start,dur=.45,dy=60)=>{const k=ease((t-start)/dur);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`};
const $=id=>document.getElementById(id);const K=740/800;
let C=null;
window.setup=cfg=>{C=cfg;
 $('sH').style.background=cfg.hook.bg;$('hpad').innerHTML=`${cfg.hook.ico?`<span class="ico ln" id="hi">${viwaiIcono(cfg.hook.ico)}</span>`:''}<span class="eye ln" id="he">${cfg.hook.eye}</span><span class="big">${cfg.hook.lines.map((l,i)=>`<span class="ln" id="h${i}">${l}</span>`).join('')}</span>`;
 $('hfoto').src=cfg.hook.foto;$('hfoto').style.top=(cfg.hook.fotoTop||1110)+'px';
 $('sP').style.background=cfg.prob.bg;$('ppad').innerHTML=`<span class="big">${cfg.prob.lines.map((l,i)=>`<span class="ln" id="p${i}">${l}</span>`).join('')}</span><span class="ln" id="psub" style="font-weight:700;font-size:52px;line-height:1.3;margin-top:44px;max-width:820px">${cfg.prob.sub}</span>`;
 $('sA').style.background=cfg.app.bg;$('d4').innerHTML=cfg.logo;};
window.render=(scene,t)=>{
 document.querySelectorAll('.sc').forEach(s=>s.style.display='none');$('s'+scene).style.display='block';
 if(scene==='H'){if($('hi'))io($('hi'),t,0,.4,30);io($('he'),t,.05);C.hook.lines.forEach((l,i)=>io($('h'+i),t,.2+i*.28));io($('hfoto'),t,.3+C.hook.lines.length*.28+.2,.6,80)}
 if(scene==='P'){C.prob.lines.forEach((l,i)=>io($('p'+i),t,.05+i*.25));io($('psub'),t,.2+C.prob.lines.length*.25)}
 if(scene==='A'){
  const S=C.app.shots;let acc=0,i=0;for(;i<S.length-1;i++){if(t<acc+S[i].d)break;acc+=S[i].d}
  const lt=t-acc,s=S[i];
  if($('acap').dataset.i!=i){$('acap').textContent=s.cap;$('acap').dataset.i=i}
  const k=ease(lt/.4);$('acap').style.opacity=k;$('acap').style.transform=`translateY(${(1-k)*40}px)`;
  const cur=$('i'+(i%2)),prev=$('i'+((i+1)%2));
  if(cur.dataset.src!=s.img){cur.src=s.img;cur.dataset.src=s.img}
  if(i>0){const pv=S[i-1];if(prev.dataset.src!=pv.img){prev.src=pv.img;prev.dataset.src=pv.img}}
  const f=i===0?1:ease(lt/.35);cur.style.opacity=f;cur.style.zIndex=2;prev.style.zIndex=1;prev.style.opacity=i===0?0:1;
  if(i===0){const ip=ease(t/.35);$('aph').style.opacity=ip;$('aph').style.transform=`translateY(${(1-ip)*100}px) scale(${1+.012*Math.sin(t*.6)})`}else $('aph').style.transform=`scale(${1+.012*Math.sin(t*.6)})`;
  const tp=$('atap');const ts=s.d-1.1;
  if(s.tap&&lt>=ts&&lt<ts+.8){const pt=$('aph').getBoundingClientRect();const kk=(lt-ts)/.8,r=30+kk*90;const cx=pt.left+s.tap[0]*K,cy=pt.top+s.tap[1]*K;tp.style.display='block';tp.style.left=(cx-r)+'px';tp.style.top=(cy-r)+'px';tp.style.width=tp.style.height=(2*r)+'px';tp.style.opacity=1-kk}else tp.style.display='none';
 }
 if(scene==='F'){['d1','d2','d3'].forEach((id,i)=>io($(id),t,.1+i*.6));io($('d4'),t,2.2);io($('d6'),t,2.45);io($('d5'),t,2.8)}
};
</script></body></html>
