<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Viwai · Panel</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/diseno/tokens.css">
<link rel="stylesheet" href="/diseno/graficos.css">
<script src="/diseno/iconos.js"></script>
<style>
/* Viwai · panel. Claro, lila de marca y el punto dorado. Una sola familia tipográfica. */
:root{
  --bg:#F6F5FB;--surface:#fff;--ink:#1D1733;--muted:#6C6787;--line:#E7E3F1;--line2:#D9D3EA;
  --brand:var(--vw-lila);--brand-strong:var(--vw-lila-fuerte);--lav:var(--vw-lavanda-suave);--lav2:#DCD3FF;--gold:var(--vw-oro);
  --ok:#1C7F55;--okbg:#DDF3E8;--warn:#94600B;--warnbg:#FFF1C7;--bad:#B23A26;--badbg:#FCE3DC;--info:#2C5DB8;--infobg:#E1EBFF;
  --f:var(--vw-letra);--r:14px;--side:232px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--brand-strong);font-weight:700;text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Estructura: menú a la izquierda, contenido a la derecha */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;background:linear-gradient(90deg,var(--surface) var(--side),var(--bg) var(--side))}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.04em;padding:0 10px 14px}.logo i{font-style:normal;color:var(--gold)}.logo span{color:var(--muted);font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
.buscar{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--muted);font:600 13px var(--f);cursor:pointer;text-align:left}
.buscar kbd{margin-left:auto;font:600 11px var(--f);border:1px solid var(--line2);border-radius:6px;padding:1px 5px;background:var(--surface)}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font:600 14px var(--f);padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
aside nav button svg{width:18px;height:18px;flex:none;color:var(--muted)}
aside nav button:hover{background:var(--bg)}
aside nav button[aria-current=page]{background:var(--lav);color:var(--brand-strong)}aside nav button[aria-current=page] svg{color:var(--brand)}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--gold);color:var(--ink);font:800 12px var(--f);text-align:center}
.badge.suave{background:var(--line);color:var(--muted)}
aside .pie{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
main{padding:28px 36px 60px;max-width:1240px;width:100%}

/* Cabecera de cada sección */
.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cab h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
.cab p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.cab .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h3{font-size:17px;font-weight:800;margin:30px 0 10px;letter-spacing:-.01em}

/* Hoy: la frase de estado es lo memorable */
.hoy{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
.hoy .frase{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.25;margin:0}
.hoy .frase b{font-weight:800;color:var(--brand-strong)}
.hoy .fecha{color:var(--muted);font-weight:600;margin:0 0 10px}
.tareas{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.tareas button{display:flex;gap:12px;align-items:center;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font:600 14px var(--f);color:var(--ink);cursor:pointer;text-align:left}
.tareas button:hover{border-color:var(--lav2);background:var(--lav)}
.tareas .n{flex:none;min-width:34px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--surface);border:1px solid var(--line)}
.tareas .urg .n{background:var(--gold);border-color:var(--gold)}
.tareas .ir{margin-left:auto;color:var(--muted);font-size:13px}
.tareas .vacia{color:var(--muted);padding:6px 2px}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.cifra{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.cifra small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.cifra .v{font-size:26px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.cifra .s{font-size:12.5px;color:var(--muted)}
.cifra.clic{cursor:pointer}.cifra.clic:hover{border-color:var(--lav2)}

.dos{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:12px}
.caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.caja>b:first-child{display:block;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* Objetivos */
.obj{display:flex;flex-direction:column;gap:8px}.obj .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}.prog i.full{background:var(--ok)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* Embudo de tiendas */
.embudo{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px var(--f);padding:7px 12px;border-radius:99px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip .c{color:var(--muted);font-weight:800}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.chip[aria-pressed=true] .c{color:var(--lav2)}

/* Tablas */
.herr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.herr h3{margin:0 auto 0 0}
.herr input[type=search]{max-width:260px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.ord{cursor:pointer;user-select:none}th.ord:hover{color:var(--ink)}th[aria-sort=ascending]::after{content:" ↑"}th[aria-sort=descending]::after{content:" ↓"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.clic{cursor:pointer}tr.clic:hover td{background:#FBFAFE}
.cuenta{font-size:13px;color:var(--muted);padding:8px 2px}
td select.mini{width:auto;padding:4px 26px 4px 9px;border-radius:99px;font-size:12.5px;font-weight:700;border-width:0;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}

.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--infobg);color:var(--info)}.lav{background:var(--lav);color:var(--brand-strong)}
td select.mini.ok,td select.mini.warn,td select.mini.bad,td select.mini.info,td select.mini.lav{border:0}

/* Controles */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.btn{border:0;border-radius:11px;padding:10px 16px;font:700 14px var(--f);background:var(--brand-strong);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#4529C2}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}.btn.sec:hover{background:var(--bg)}
.btn.bad{background:var(--bad)}
.btn.peq{padding:6px 11px;font-size:13px;border-radius:9px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line2);border-radius:11px;padding:9px 11px;width:100%}
textarea{min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
label.c{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}label.c input{width:auto}

dialog{border:0;border-radius:20px;padding:0;width:min(640px,94vw);max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(29,23,51,.25)}
dialog::backdrop{background:rgba(29,23,51,.4)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px}
dialog form .w{grid-column:1/-1}dialog h3{grid-column:1/-1;margin:0}
.acc-f{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}

/* Paleta ⌘K */
#paleta{width:min(560px,94vw);top:12vh;margin-top:0}
#paleta .pi{padding:14px;border-bottom:1px solid var(--line)}#paleta .pi input{border:0;font-size:17px;padding:6px}
#paleta ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#paleta li button{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font:600 14px var(--f);color:var(--ink);cursor:pointer;display:flex;gap:10px}
#paleta li button span{color:var(--muted);margin-left:auto;font-weight:600;font-size:13px}
#paleta li button[aria-selected=true]{background:var(--lav)}

/* Aviso al guardar */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;z-index:50}
#toast.ve{opacity:1;transform:translateX(-50%)}

.login{max-width:420px;margin:12vh auto;display:flex;flex-direction:column;gap:14px;padding:0 20px}
.login b{font-size:34px;font-weight:800;letter-spacing:-.04em}
.reparto{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:12px;font-weight:800}
.reparto span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg.spark{width:100%;height:84px;display:block}
.vacio{color:var(--muted);padding:22px;text-align:center}
.aviso{background:var(--lav);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.err{color:var(--bad);font-size:14px}
.esc{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.prod{display:flex;flex-direction:column;gap:8px;padding:12px}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg)}
.prod .fila{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.caja summary{cursor:pointer;font-weight:800}
.cargando{color:var(--muted);padding:40px 0}

/* Móvil: el menú pasa arriba en una tira */
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  aside{position:sticky;height:auto;z-index:10;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .logo{padding:0 8px 0 2px;font-size:19px}.logo span,.buscar kbd,aside .pie{display:none}
  .buscar{margin:0 6px 0 0;flex:none}
  aside nav{flex-direction:row}aside nav button{white-space:nowrap}aside nav button svg{display:none}
  main{padding:20px 16px 50px}
  .hoy,.dos{grid-template-columns:1fr}
  dialog form{grid-template-columns:1fr}
}
/* ===== v2: más gráfico. Cada sección tiene su color suave (como la app) ===== */
:root{--t-lav:var(--vw-lavanda-suave);--t-mint:var(--vw-menta-suave);--t-sky:var(--vw-cielo-suave);--t-butter:var(--vw-mantequilla);--t-peach:var(--vw-melocoton);--okc:var(--vw-g2);--acc:#6A4CF5;--tint:var(--t-lav);
  --sh:0 1px 2px rgba(29,23,51,.04),0 6px 22px -12px rgba(29,23,51,.14)}
body[data-sec=dinero],body[data-sec=reembolsos]{--acc:#1FA37A;--tint:var(--t-mint)}
body[data-sec=afiliados],body[data-sec=envios]{--acc:#3B82F6;--tint:var(--t-sky)}
body[data-sec=catalogo],body[data-sec=calendario]{--acc:#C98A00;--tint:var(--t-butter)}
body[data-sec=campanas]{--acc:#E0664F;--tint:var(--t-peach)}
main{max-width:1280px}
.caja,.cifra,.tw{box-shadow:var(--sh);border-color:#EEEAF6}
.caja{border-radius:18px}
/* Portada de cada sección: degradado suave del color de la sección */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px 26px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--acc) 14%,var(--line));
  background:linear-gradient(140deg,color-mix(in srgb,var(--tint) 92%,#fff),var(--surface) 72%);box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%);pointer-events:none}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
.hero .sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.hero .gran{font-size:clamp(34px,4.4vw,52px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 4px}
.hero .acc{position:relative;z-index:1}
.hero.hoy{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
.cab{display:none}
/* Tareas */
.tareas button{background:rgba(255,255,255,.75);backdrop-filter:blur(4px)}
/* Chips con punto de color */
.chip .p{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
/* Línea de tiempo (calendario) */
.tl{display:flex;flex-direction:column;gap:18px}
.tlm h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tli{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid #EEEAF6;box-shadow:var(--sh);margin-bottom:6px;cursor:pointer}
.tli:hover{border-color:var(--lav2)}
.tli .dia{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;border-radius:12px;background:var(--tc,var(--bg));color:var(--ic,var(--ink))}
.tli .dia b{font-size:19px;line-height:1}.tli .dia span{font-size:10.5px;font-weight:700;text-transform:uppercase}
.tli.hecho{opacity:.55}.tli.hecho .q{text-decoration:line-through}
.tli .q{font-weight:700}.tli .note{margin:0}
.ok-btn{border:1.5px solid var(--line2);background:var(--surface);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--muted)}
.ok-btn[aria-pressed=true]{background:var(--okc);border-color:var(--okc);color:#fff}
/* Año de campañas */
.anyo{position:relative;padding-top:20px}
.anyo .meses{display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;font-weight:700;color:var(--muted);position:absolute;inset:0 0 auto 0}
.anyo .meses span{border-left:1px dashed var(--line);padding-left:4px;height:100%}
.anyo .fila{position:relative;height:30px;margin:4px 0}
.anyo .cp{position:absolute;top:0;height:28px;border-radius:9px;padding:0 9px;font:700 12px/28px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.anyo .cp{border-radius:99px;height:12px;top:8px;padding:0}.anyo .cpl{position:absolute;top:0;font-size:12px;line-height:28px;white-space:nowrap;color:var(--muted);cursor:pointer}.anyo .cpl b{color:var(--ink)}
.tareas .ir{white-space:nowrap}
.anyo .hoyl{position:absolute;top:16px;bottom:0;width:2px;background:var(--gold);border-radius:2px}
details.caja summary{list-style:none;display:flex;align-items:center;gap:8px}details.caja summary::-webkit-details-marker{display:none}
details.caja summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.caja[open] summary::after{transform:rotate(-135deg)}
aside nav button[aria-current=page]{background:linear-gradient(90deg,var(--lav),#F6F3FF)}
.vista-entra{animation:entra .28s ease-out}@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Móvil: el menú pasa abajo, como en la app */
@media (max-width:900px){
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(29,23,51,.08)}
  .logo,.buscar{display:none}
  aside nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;position:relative}aside nav button svg{display:block;width:20px;height:20px}
  aside nav .badge{position:absolute;top:0;right:2px;min-width:16px;padding:0 4px;font-size:10px}
  main{padding:16px 16px 96px}
  .hero.hoy,.g2,.g3,.g2i{grid-template-columns:1fr}
  .donut{grid-template-columns:120px 1fr}.donut svg{width:120px;height:120px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:25px}
  .hero .acc{float:none!important;margin-bottom:12px}
  .hero .gran{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <b>Viwai<span style="color:var(--gold)">.</span> panel</b>
  <p>Entra con el correo de administración. Te llega un enlace para entrar, sin contraseña.</p>
  <label class="f">Correo <input id="email" type="email" autocomplete="email" value="hola@viwai.es"></label>
  <button class="btn" id="enviar">Enviarme el enlace</button>
  <p id="loginMsg" class="note"></p>
</div>
<div id="app" class="app" hidden>
  <aside>
    <div class="logo">Viwai<i>.</i><span>panel</span></div>
    <button class="buscar" id="abrirPaleta" aria-label="Buscar o ir a…"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar o ir a…<kbd>⌘K</kbd></button>
    <nav id="tabs" aria-label="Secciones"></nav>
    <div class="pie"><span id="yo"></span><span id="act"></span><div class="row" style="margin:0"><button class="btn sec peq" id="refrescar">Actualizar</button><button class="btn sec peq" id="salir">Salir</button></div></div>
  </aside>
  <main id="vista"></main>
</div>
<dialog id="dlg"></dialog>
<dialog id="paleta" aria-label="Buscar"><div class="pi"><input id="pq" placeholder="Ir a una sección o buscar una tienda…" autocomplete="off"></div><ul id="pl" role="listbox"></ul></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/config.js"></script>
<script type="module" src="./admin.js"></script>
</body>
</html>
